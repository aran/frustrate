name: frustrate
description: >-
  frustrate runtime for Dart: wire codec, opaque handle plumbing, and FFI
  transport for frustrate-generated bridges.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  ffi: 2.2.0

# Pinned to match rules_dart's internal ext lock (the pub extension rejects
# version skew of shared transitive packages across lock files).
dev_dependencies:
  analyzer: 10.2.0
  test: 1.31.1
  # The version of rules_dart that MODULE.bazel depends on. Under Bazel,
  # rules_dart's own `//dart/runfiles` serves it (`resolve` in MODULE.bazel).
  # To use a local rules_dart's with `dart pub get`, override it in an untracked
  # `pubspec_overrides.yaml`.
  runfiles: 0.8.1

# Force shared transitive packages to the exact versions in rules_dart's
# internal ext lock (the pub extension rejects cross-lock version skew).
dependency_overrides:
  coverage: 1.15.0
  meta: 1.18.2
