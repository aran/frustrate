[package]
name = "frustrate-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "frustrate interface extraction (syn-based), model checking, and code emission"

[dependencies]
anyhow = "1"
heck = "0.5"
# span-locations: turns on line/column tracking for `syn::Error::span()`, so a
# parse failure can report where in the source it happened (parse.rs).
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
pretty_assertions = "1"

[[bin]]
name = "frustrate-codegen"
path = "src/main.rs"
