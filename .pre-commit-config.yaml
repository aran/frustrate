# Hooks run with prek (https://github.com/j178/prek), which reads this
# pre-commit format.
# The commit message check runs in commit-msg stage
# but we don't want to run the other hooks on commit messages. The manual
# stage runs every check without .bazel_env, as CI does (see below).
default_stages: [pre-commit, manual]
# One `prek install` sets up both stages
default_install_hook_types: [pre-commit, commit-msg]
repos:
  # The hooks overhead supplies, at the versions it pins: the commit message
  # policy in AGENTS.md (a conventional-commit subject and the `Changelog:`
  # trailer rules), yamlfmt and typos. They run overhead's tools from
  # .bazel_env/bin, without Bazel. Set that up once in the main checkout,
  # in each new worktree, and after bumping overhead's pin
  # (a hook failing with "No such file or directory" means it is missing):
  #   bazel run --noincompatible_auto_exec_groups @overhead//:bazel_env
  # The manual-stage copies run the same tools through `bazel run`, for CI and
  # Windows, where bazel_env does not run:
  #   bazel run @overhead//lint:prek -- run --hook-stage manual --all-files
  - repo: local
    hooks:
      - id: commit-message
        name: commit message policy
        entry: .bazel_env/bin/check-commit-messages
        language: system
        stages: [commit-msg]
      - id: yamlfmt
        name: yamlfmt
        entry: .bazel_env/bin/yamlfmt
        language: system
        types: [yaml]
        stages: [pre-commit]
      - id: typos
        name: typos
        entry: .bazel_env/bin/typos --force-exclude
        language: system
        types: [text]
        stages: [pre-commit]
      - id: yamlfmt
        name: yamlfmt
        entry: bazel run --ui_event_filters=-info --noshow_progress --show_result=0 @overhead//lint:yamlfmt --
        language: system
        types: [yaml]
        stages: [manual]
      - id: typos
        name: typos
        entry: bazel run --ui_event_filters=-info --noshow_progress --show_result=0 @overhead//lint:typos -- --force-exclude
        language: system
        types: [text]
        stages: [manual]
