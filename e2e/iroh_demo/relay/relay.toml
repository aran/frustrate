# Production configuration for the Tin Can relay.
#
# NEVER RUN. This file has never been loaded by a relay serving real traffic —
# see README.md. It has been parsed by the real binary (that much is verified),
# but no certificate has ever been issued against it.
#
# Two edits are required before this works, both marked EDIT:
#   1. `hostname` must be the DNS name whose A record points at this VM.
#   2. `contact` must be a mailbox Let's Encrypt can reach.
#
# Field names and defaults come from iroh-relay 1.0.3 `src/main.rs`. Ports come
# from `src/defaults.rs`, which is authoritative: the crate README's "7824" for
# QUIC address discovery is a typo for 7842.

# Relay traffic between endpoints. This is the whole point.
enable_relay = true

# QUIC address discovery on udp/7842 — the server reports each client the
# address it was observed from, which is what makes hole punching possible.
# Requires TLS to be configured, hence the [tls] section below.
enable_quic_addr_discovery = true

# tcp/80. Not the relay's main socket once TLS is on: with [tls] present the
# relay services move to https_bind_addr (443) and this socket serves only the
# captive-portal probe. It must still be open, because that is where Let's
# Encrypt's HTTP-01 challenge lands.
#
# Binding below 1024 is why the systemd unit grants CAP_NET_BIND_SERVICE rather
# than running the process as root.
http_bind_addr = "[::]:80"

# Open. This relay carries a demo; there is nothing to protect and a token
# would just be one more thing to inject into the app. Swap for
#   access.shared_token = ["..."]
# if it ever gets pointed at anything that matters — the token is then also
# overridable at runtime by IROH_RELAY_ACCESS_TOKEN, which the systemd unit can
# read from an EnvironmentFile so it never lands in git.
access = "everyone"

# Metrics on loopback only. The default is http_bind_addr's IP with port 9090,
# i.e. [::]:9090 — publicly bound. GCP's default firewall happens to drop it,
# but a relay whose exposure depends on a firewall default is a relay one
# `gcloud compute firewall-rules create` away from serving its internals to the
# internet.
enable_metrics = true
metrics_bind_addr = "[::1]:9090"

[tls]
# EDIT: the DNS name. This must already resolve to this VM's external IP before
# the relay first starts, or the ACME HTTP-01 challenge fails.
hostname = "relay.example.com"

# EDIT: a mailbox for expiry warnings.
contact = "you@example.com"

# Let's Encrypt, via tokio-rustls-acme. The certificate is fetched on first
# start and cached in cert_dir, so a restart does not re-issue and does not
# count against the rate limit.
cert_mode = "LetsEncrypt"

# Persist the ACME account key and certificate across restarts and across
# preemption-then-boot. If this is lost, every start re-issues, and Let's
# Encrypt's duplicate-certificate limit (5/week) is reachable in an afternoon
# of debugging. The systemd unit owns this directory.
cert_dir = "/var/lib/iroh-relay/certs"

# Production ACME. Set false to use the staging directory while iterating:
# staging certificates are untrusted by browsers (so M5's wss:// will not work)
# but its rate limits are far looser. IROH_RELAY_ACME_URL overrides the
# directory URL entirely, for a local pebble.
prod_tls = true

# https_bind_addr and quic_bind_addr are omitted deliberately: they default to
# http_bind_addr's IP with ports 443 and 7842, which is exactly what is wanted.
