# Bazel reads only `pubspec.lock`, through `flutter_pub.from_lock` in
# MODULE.bazel, which maps the two path packages below to the Bazel targets
# that build them. //:app_flutter and //:app_web name their deps in BUILD.bazel.
# Regenerate the lock with `bazel run @rules_flutter//flutter/pub -- get` so it
# resolves against the SDK Bazel pins.
name: frustrate_demo
publish_to: none
environment:
  sdk: ^3.0.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  # Path deps, not hosted: this demo and the runtime it exercises are one
  # source tree. `frustrate` is direct because lib/main.dart imports
  # package:frustrate/workers.dart for the actor race, not only through
  # the bridge.
  demo_bridge:
    path: bridge
  frustrate:
    path: ../../runtime/dart
