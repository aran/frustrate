<!DOCTYPE html>
<!--
  The facility-std app's copy of ../web/index.html — see the comments there.
  Identical posture: no policy in the source page (dwds needs an inline
  script for hot restart), the strict policy substituted into the bundle at
  the $FRUSTRATE_CSP marker by //custom_std:index_html.

  Unlike the threaded page this build needs no cross-origin isolation: it is
  stock single-threaded wasm that happens to link a std whose stubs call the
  host. Isolation only sharpens `performance.now()` (5 µs against 100 µs), and
  the std-facility card reads a clock across real work rather than a tight
  pair, so it is legible either way. Keep in sync.
-->
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <!-- $FRUSTRATE_CSP -->
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A Flutter web application built with Bazel">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Frustrate Demo (custom std)">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Frustrate Demo (custom std)</title>
</head>
<body>
  <script src="frustrate.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
