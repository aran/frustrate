[package]
name = "shape-coverage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Reports member shapes the checker accepts and the repo's bridge sources never instantiate"

# The source sits at the package root rather than in `src/`, matching
# `bazel/wasm_block_check`. Unlike that one this has dependencies: it runs
# under cargo, and under Bazel only as a test (`:shape_coverage_test`), never in
# an exec configuration, so the `@frustrate_crates` hub argument for zero
# dependencies does not apply.
[[bin]]
name = "shape_coverage"
path = "main.rs"

[dependencies]
frustrate-codegen = { workspace = true }
