# e2e/wasi_demo is a module that depends on frustrate, so BCR builds it with
# the archive under test substituted for the registry copy.
bcr_test_module:
  module_path: "e2e/wasi_demo"
  matrix:
    platform: ["ubuntu2204", "macos"]
    bazel: ["9.x"]
  tasks:
    build_demo:
      name: "Build the demo's web app"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "//:app_web"
