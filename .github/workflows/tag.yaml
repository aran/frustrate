# Tags a new release from the conventional-commit subjects since the last one,
# then releases it. It runs only when dispatched from the GitHub UI.
name: Tag a Release
on:
  workflow_dispatch:
jobs:
  tag:
    uses: aran/rules_dart/.github/workflows/overhead-tag.yaml@e46da5b40a704d1f8f3aa466cc61d7d0b24f4d6d
    permissions:
      contents: write # allow create tag
  release:
    needs: tag
    uses: ./.github/workflows/release.yaml
    with:
      tag_name: ${{ needs.tag.outputs.new-tag-version }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
    if: needs.tag.outputs.new-tag == 'true' && needs.tag.outputs.new-tag-version-type != 'major'
    permissions:
      contents: write
      id-token: write
      attestations: write
