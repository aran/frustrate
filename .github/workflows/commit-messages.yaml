# Checks every commit pushed to main against the commit policy in AGENTS.md:
# a conventional-commit subject and a `Changelog:` trailer on user-visible
# commits. Changes land on main directly, so this runs on push rather than on
# pull requests.
name: Commit messages
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      # The first push of a branch has no "before" revision (GitHub sends all
      # zeros), and a force push's "before" is a commit this clone lacks;
      # `<sha>^!` is then just the pushed commit.
      - name: Check the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}"; then
            range="$AFTER^!"
          else
            range="$BEFORE..$AFTER"
          fi
          bazel run //tools/changelog:check -- --range "$range"
