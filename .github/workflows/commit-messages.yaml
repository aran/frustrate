# Checks every commit pushed to main against the commit policy in AGENTS.md.
name: Commit messages
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    uses: aran/rules_dart/.github/workflows/overhead-commit-messages.yaml@0fc7037909e27176df332e0b009a6f280509015f
    with:
      # Bump to start the Bazel caches afresh (see CACHE_VERSION in ci.yaml).
      cache-version: "1"
