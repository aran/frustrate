# Checks every commit pushed to main against the commit policy in AGENTS.md.
name: Commit messages
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    uses: aran/rules_dart/.github/workflows/overhead-commit-messages.yaml@4dc9403ab62273d54c5d97b62c1faad0381059a2
    with:
      # Bump to start the Bazel caches afresh (see CACHE_VERSION in ci.yaml).
      cache-version: "1"
