# `bazel test //...` in the root workspace and in bazel_frb and e2e/iroh_demo,
# each its own module (in .bazelignore). The smoke jobs below make a few real
# bridge calls on each platform the project supports; macOS and Linux are already
# covered by `bazel test //...`, which runs //tests/dart_integration natively.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
env:
  # Part of every setup-bazel cache key below. A cache restored on an exact key
  # hit is never saved again, so it freezes at whatever the first run put in
  # it; bump this number to start the caches afresh. The Commit messages
  # workflow (commit-messages.yaml) passes its own: bump that one too.
  CACHE_VERSION: "1"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  # Every job below has a timeout, one value per kind of job, at about three
  # times its slowest recent run: 15 minutes for checks that run one or two
  # commands, 30 for a Bazel build or test of one workspace, 60 for the root
  # workspace's whole-program run and the simulator and emulator runs.
  test:
    name: bazel test (${{ matrix.folder }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        folder: [".", "bazel_frb", "e2e/iroh_demo"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          disk-cache: ${{ matrix.os }}-${{ matrix.folder }}
          repository-cache: true
      # The root workspace's wasm toolchains link a patched std, built from the
      # pinned nightly through the runner's rustup and never checked in, so
      # stage both flavours first. bazel_frb has no wasm build.
      - name: Cache the custom std
        if: matrix.folder == '.'
        id: custom-std
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: toolchain/custom_std/dist
          key: custom-std-${{ runner.os }}-${{ hashFiles('toolchain/custom_std/nightly-pin.txt', 'toolchain/custom_std/rustflags.txt', 'toolchain/custom_std/tool/*.dart', 'toolchain/custom_std/pal/*', 'toolchain/custom_std/stub/**') }}
      - name: Build the custom std
        if: matrix.folder == '.' && steps.custom-std.outputs.cache-hit != 'true'
        run: |
          bazel run //toolchain/custom_std:build -- --facilities=atomics
          bazel run //toolchain/custom_std:build -- --facilities=clock,random,stdio,thread
      - name: bazel test //...
        working-directory: ${{ matrix.folder }}
        run: bazel test //... --test_output=errors --test_summary=terse

  # Every hook in .pre-commit-config.yaml, with the prek overhead pins, as a
  # commit runs them: one build puts overhead's tools in .bazel_env, then the
  # hooks run them without Bazel.
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          repository-cache: true
      - run: bazel run --noincompatible_auto_exec_groups @overhead//:bazel_env -- update-symlink
      - run: bazel run --noincompatible_auto_exec_groups @overhead//lint:prek -- run --all-files --show-diff-on-failure
      - name: bazelrc preset is the one overhead generates
        run: bazel run @overhead//preset -- --check
      - name: conclusion needs every job, and a job runs in every workspace
        run: bazel run @overhead//ci:check

  # A consuming module must be able to load every package of the published
  # module: tools and IDE plugins enumerate `@frustrate//...`. wasi_demo takes
  # frustrate as an ordinary dependency, through local_path_override.
  consumer-query:
    name: consumer query
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          repository-cache: true
      - name: Query the whole module from a consumer
        working-directory: e2e/wasi_demo
        run: bazel query "@frustrate//..."

  # Docs-only changes skip the smoke jobs.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

  # Web: //tests/dart_integration:smoke_test in Chrome, on each compiler of a
  # Flutter web build. The driver runs the pub test runner, so it needs a Dart
  # SDK on PATH (the version the Bazel toolchain pins) and the runner's Chrome.
  smoke-web:
    name: smoke (web, ${{ matrix.compiler }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [dart2wasm, dart2js]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          disk-cache: smoke-web
          repository-cache: true
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.7
      - name: smoke_test in Chrome
        run: bazel run //tests/dart_integration:web_test -- test/smoke_test.dart -c ${{ matrix.compiler }}

  # iOS: the demo gallery in a simulator, driven by e2e/flutter_demo's `smoke`,
  # which waits for the Rust calls' results on screen. The demo is its own
  # Bazel module that takes rules_flutter from its MODULE.bazel pin.
  smoke-ios:
    name: smoke (iOS simulator)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: e2e/flutter_demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          disk-cache: smoke-ios
          repository-cache: true
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: The gallery answers
        run: bazel run //:smoke -- -t //:app_ios -d "ios-simulator:$SIMULATOR"

  # Android: the demo gallery on an x86_64 emulator (KVM), the same driver.
  smoke-android:
    name: smoke (Android emulator)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: e2e/flutter_demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The runner has an Android SDK and NDK; --config=android registers their
      # toolchains. The tool builds the ABI of the device it runs on.
      - name: Point Bazel at the SDK
        run: |
          echo 'common --repo_env=ANDROID_HOME' >> .bazelrc.user
          echo 'common --repo_env=ANDROID_NDK_HOME' >> .bazelrc.user
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          cache-version: ${{ env.CACHE_VERSION }}
          bazelisk-cache: true
          disk-cache: smoke-android
          repository-cache: true
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: e2e/flutter_demo
          script: bazel run //:smoke -- -t //:app_android --build-arg=--config=android -d android

  # The one job branch protection requires: it fails when any job it needs
  # failed or was cancelled. A smoke job skipped for a docs-only change counts
  # as passed. `bazel run @overhead//ci:check` checks that it needs every job.
  conclusion:
    needs:
      - test
      - pre-commit
      - consumer-query
      - changes
      - smoke-web
      - smoke-ios
      - smoke-android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
