[package]
name = "wasm-block-check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "wasm_block_check"
description = "Scans a --cfg frustrate_block_check build for what a no_block member can reach: waits, slow functions, IO"

# The source sits at the package root rather than in `src/`, so the Bazel
# `rust_binary` and this manifest name the same file.
[[bin]]
name = "wasm_block_check"
path = "main.rs"

[[bin]]
name = "frustrate-link-filter"
path = "link_filter.rs"

[dependencies]
# Without default features it depends only on `bitflags`; `simd` decodes 0xFD
# instructions, and with `features` off every proposal is read.
rustc-demangle = "0.1"
wasmparser = { version = "0.244", default-features = false, features = ["std", "simd"] }
