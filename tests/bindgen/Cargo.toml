# The third-party crates of the wasm-bindgen fixture, for a crate hub of its
# own (//:MODULE.bazel, a dev dependency), so frustrate's published crate
# resolution does not grow by a graph only this test uses. Resolution-only:
# Bazel builds the crate (BUILD.bazel), with frustrate from this repo.
[package]
name = "bindgen_api"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["WorkerGlobalScope"] }
# Pinned exactly to the CLI in //tests/bindgen/cli:Cargo.toml.
wasm-bindgen = "=0.2.126"

[workspace]
