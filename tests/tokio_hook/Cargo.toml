# The third-party crates of the tokio hook tests, for a crate hub of its own
# (//:MODULE.bazel, a dev dependency): tokio must not enter the root
# `Cargo.lock`, because that lockfile resolves `@frustrate_crates` for every
# triple frustrate builds for. Resolution-only: Bazel builds the tests
# (BUILD.bazel), with frustrate and ext/tokio from this repo.
[package]
name = "tokio_hook"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The same task primitive `frustrate::__private::executor` is built on. The gate tests
# need it directly because they must be a cooperative executor that is
# *not* frustrate's, reduced to the property under test.
async-task = "4.7.1"
# `rt-multi-thread` is load-bearing, not a preference: a `new_current_thread`
# runtime that nobody is `block_on`-ing has a timer wheel nothing turns, which
# is the silent-stall hazard `current_thread_handle_never_fires` pins.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }

[workspace]
